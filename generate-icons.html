<!DOCTYPE html>
<html>
<head>
  <title>Generate WonderKidz Icons</title>
</head>
<body>
  <canvas id="canvas192" width="192" height="192" style="display:none;"></canvas>
  <canvas id="canvas512" width="512" height="512" style="display:none;"></canvas>
  
  <script>
    // Generate 192x192 icon
    const canvas192 = document.getElementById('canvas192');
    const ctx192 = canvas192.getContext('2d');
    
    // Background
    ctx192.fillStyle = '#F59E0B';
    ctx192.fillRect(0, 0, 192, 192);
    
    // Emoji
    ctx192.font = 'bold 100px Arial';
    ctx192.textAlign = 'center';
    ctx192.textBaseline = 'middle';
    ctx192.fillText('🎓', 96, 80);
    
    // Text
    ctx192.font = 'bold 24px Arial';
    ctx192.fillStyle = 'white';
    ctx192.fillText('WonderKidz', 96, 150);
    
    // Generate 512x512 icon
    const canvas512 = document.getElementById('canvas512');
    const ctx512 = canvas512.getContext('2d');
    
    // Background
    ctx512.fillStyle = '#F59E0B';
    ctx512.fillRect(0, 0, 512, 512);
    
    // Emoji
    ctx512.font = 'bold 280px Arial';
    ctx512.textAlign = 'center';
    ctx512.textBaseline = 'middle';
    ctx512.fillText('🎓', 256, 220);
    
    // Text
    ctx512.font = 'bold 64px Arial';
    ctx512.fillStyle = 'white';
    ctx512.fillText('WonderKidz', 256, 400);
    
    // Download links
    setTimeout(() => {
      const link192 = document.createElement('a');
      link192.download = 'icon-192.png';
      link192.href = canvas192.toDataURL('image/png');
      link192.textContent = 'Download 192x192 icon';
      link192.style.display = 'block';
      link192.style.margin = '20px';
      link192.style.fontSize = '20px';
      document.body.appendChild(link192);
      
      const link512 = document.createElement('a');
      link512.download = 'icon-512.png';
      link512.href = canvas512.toDataURL('image/png');
      link512.textContent = 'Download 512x512 icon';
      link512.style.display = 'block';
      link512.style.margin = '20px';
      link512.style.fontSize = '20px';
      document.body.appendChild(link512);
      
      document.body.insertAdjacentHTML('afterbegin', '<h2 style="margin:20px;">Click the links below to download the icons, then place them in the public/ folder</h2>');
    }, 100);
  </script>
</body>
</html>
