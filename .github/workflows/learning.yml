name: Verify WonderKids learning

on:
  push:
    branches: [feat/multilingual-picture-courses]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify lesson flows in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 --strictPort &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonderkids-learning-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
